<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#121214"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
  </defs>
  <rect width="720" height="400" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="718" height="398" rx="23" fill="none" stroke="#3a3a3e"/>
  <text x="36" y="44" fill="#C0C0C0" font-family="system-ui,sans-serif" font-size="16" font-weight="600">Host vs join</text>
  <text x="36" y="68" fill="#8a8a90" font-family="system-ui,sans-serif" font-size="12">Three paths from a venue table listing</text>

  <rect x="40" y="100" width="200" height="240" rx="16" fill="#1a1a1d" stroke="#C0C0C0"/>
  <text x="140" y="140" text-anchor="middle" fill="#f2f2f2" font-family="system-ui,sans-serif" font-size="14" font-weight="600">1. Host</text>
  <text x="140" y="170" text-anchor="middle" fill="#9a9aa0" font-family="system-ui,sans-serif" font-size="12">Slot is free</text>
  <text x="140" y="198" text-anchor="middle" fill="#b0b0b6" font-family="system-ui,sans-serif" font-size="11">Pay host fee + min spend</text>
  <text x="140" y="220" text-anchor="middle" fill="#b0b0b6" font-family="system-ui,sans-serif" font-size="11">Creates Hosted Table</text>
  <text x="140" y="242" text-anchor="middle" fill="#b0b0b6" font-family="system-ui,sans-serif" font-size="11">Group chat + QR</text>
  <text x="140" y="280" text-anchor="middle" fill="#C0C0C0" font-family="system-ui,sans-serif" font-size="11">You manage invites</text>

  <rect x="260" y="100" width="200" height="240" rx="16" fill="#1a1a1d" stroke="#4a4a50"/>
  <text x="360" y="140" text-anchor="middle" fill="#f2f2f2" font-family="system-ui,sans-serif" font-size="14" font-weight="600">2. Join</text>
  <text x="360" y="170" text-anchor="middle" fill="#9a9aa0" font-family="system-ui,sans-serif" font-size="12">Public hosted table</text>
  <text x="360" y="198" text-anchor="middle" fill="#b0b0b6" font-family="system-ui,sans-serif" font-size="11">Join fee + optional menu</text>
  <text x="360" y="220" text-anchor="middle" fill="#b0b0b6" font-family="system-ui,sans-serif" font-size="11">Private ’ host approval</text>
  <text x="360" y="242" text-anchor="middle" fill="#b0b0b6" font-family="system-ui,sans-serif" font-size="11">Added to group when Going</text>
  <text x="360" y="280" text-anchor="middle" fill="#C0C0C0" font-family="system-ui,sans-serif" font-size="11">Host gets 85% of join fee</text>

  <rect x="480" y="100" width="200" height="240" rx="16" fill="#1a1a1d" stroke="#4a4a50"/>
  <text x="580" y="140" text-anchor="middle" fill="#f2f2f2" font-family="system-ui,sans-serif" font-size="14" font-weight="600">3. Join host</text>
  <text x="580" y="170" text-anchor="middle" fill="#9a9aa0" font-family="system-ui,sans-serif" font-size="12">Slot already hosted</text>
  <text x="580" y="198" text-anchor="middle" fill="#b0b0b6" font-family="system-ui,sans-serif" font-size="11">Redirects to Hosted Table</text>
  <text x="580" y="220" text-anchor="middle" fill="#b0b0b6" font-family="system-ui,sans-serif" font-size="11">No second host session</text>
  <text x="580" y="242" text-anchor="middle" fill="#b0b0b6" font-family="system-ui,sans-serif" font-size="11">Same join rules apply</text>
  <text x="580" y="280" text-anchor="middle" fill="#C0C0C0" font-family="system-ui,sans-serif" font-size="11">One table, one host</text>
</svg>
